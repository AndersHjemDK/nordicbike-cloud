<!DOCTYPE html>
<html lang="da">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>NordicBike</title>
  <style>
    :root {
      --bg: #f5f7f8;
      --text: #1c2b36;
      --muted: #5a6b77;
      --accent: #b5303a;
      --line: #d6dde2;
    }
    @media (prefers-color-scheme: dark) {
      :root {
        color-scheme: dark;
        --bg: #14202a;
        --text: #e8eef2;
        --muted: #9aaab6;
        --accent: #e0636c;
        --line: #2c3c48;
      }
    }
    body {
      margin: 0;
      background: var(--bg);
      color: var(--text);
      font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
      line-height: 1.6;
    }
    .wrap {
      max-width: 720px;
      margin: 0 auto;
      padding: 0 1.25rem;
    }
    header {
      border-bottom: 1px solid var(--line);
      padding: 1rem 0;
    }
    .logo {
      font-weight: 700;
      font-size: 1.25rem;
      color: var(--text);
      text-decoration: none;
    }
    main {
      padding: 4rem 0;
    }
    h1 {
      font-size: clamp(2rem, 6vw, 3rem);
      line-height: 1.15;
      margin: 0 0 1rem;
    }
    p {
      color: var(--muted);
      margin: 0 0 1.5rem;
    }
    .button {
      display: inline-block;
      background: var(--accent);
      color: #fff;
      padding: 0.75rem 1.5rem;
      border-radius: 4px;
      text-decoration: none;
      font-weight: 600;
    }
    .button:focus-visible {
      outline: 3px solid var(--text);
      outline-offset: 3px;
    }
    footer {
      border-top: 1px solid var(--line);
      padding: 1.5rem 0;
      font-size: 0.9rem;
      color: var(--muted);
    }
  </style>
</head>
<body>
  <header>
    <div class="wrap">
      <a href="/" class="logo">NordicBike</a>
    </div>
  </header>

  <main>
    <div class="wrap">
      <h1>Cykler til nordisk vejr</h1>
      <p>Solide cykler til hverdag, pendling og weekendture – bygget til at holde, uanset om det regner eller sner.</p>
      <a href="mailto:kontakt@nordicbike.dk" class="button">Kontakt os</a>
    </div>
  </main>

  <footer>
    <div class="wrap">
      &copy; 2026 NordicBike
    </div>
  </footer>
</body>
</html>
